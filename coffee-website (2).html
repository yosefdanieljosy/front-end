<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hearth &amp; Bean — Small-Batch Coffee Roastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<style>
  :root{
    --bg: #1C1410;
    --bg-2: #241A14;
    --surface: #2A1F18;
    --surface-2: #34281F;
    --cream: #EFE6D8;
    --cream-dim: #C9BCA9;
    --muted: #8F7F6C;
    --gold: #C89B3C;
    --gold-dim: #97772F;
    --rust: #A5502A;
    --line: rgba(239,230,216,0.12);
    --font-display: 'Fraunces', serif;
    --font-body: 'Sora', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:var(--font-body);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  img{ max-width:100%; display:block; }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background:var(--gold); color:var(--bg); }

  .wrap{ max-width:1120px; margin:0 auto; padding:0 32px; }

  /* NAV */
  header.site{
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:rgba(28,20,16,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px; max-width:1120px; margin:0 auto;
  }
  .logo{
    font-family:var(--font-display); font-size:22px; font-weight:600;
    letter-spacing:0.02em; display:flex; align-items:center; gap:10px;
  }
  .logo .mark{
    width:28px; height:28px; border-radius:50%;
    border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:11px; color:var(--gold);
  }
  .navlinks{ display:flex; gap:36px; }
  .navlinks a{
    font-size:14px; color:var(--cream-dim); letter-spacing:0.03em;
    transition:color 0.2s ease; position:relative;
  }
  .navlinks a:hover{ color:var(--gold); }
  .navcta{
    border:1px solid var(--gold-dim); color:var(--gold);
    padding:9px 20px; border-radius:2px; font-size:13px;
    letter-spacing:0.05em; background:transparent;
    transition:all 0.2s ease;
  }
  .navcta:hover{ background:var(--gold); color:var(--bg); }
  .navtoggle{ display:none; background:none; border:none; color:var(--cream); font-size:22px; }

  /* HERO */
  .hero{
    min-height:100vh; display:flex; align-items:center;
    padding:140px 0 80px;
    position:relative; overflow:hidden;
    background:
      radial-gradient(ellipse 800px 500px at 85% 20%, rgba(200,155,60,0.10), transparent 60%),
      radial-gradient(ellipse 600px 400px at 10% 90%, rgba(165,80,42,0.12), transparent 60%);
  }
  .hero-grid{
    display:grid; grid-template-columns:1.1fr 0.9fr; gap:60px; align-items:center;
  }
  .eyebrow{
    font-family:var(--font-mono); font-size:12px; letter-spacing:0.15em;
    color:var(--gold); text-transform:uppercase; margin-bottom:22px;
    display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{ content:''; width:24px; height:1px; background:var(--gold); }
  h1.hero-title{
    font-family:var(--font-display); font-weight:600;
    font-size:clamp(40px, 6vw, 72px); line-height:1.02; letter-spacing:-0.01em;
    color:var(--cream); margin-bottom:26px;
  }
  h1.hero-title em{ font-style:italic; color:var(--gold); font-weight:500; }
  .hero p.lede{
    font-size:17px; color:var(--cream-dim); max-width:440px; margin-bottom:36px;
  }
  .hero-actions{ display:flex; gap:16px; align-items:center; }
  .btn-primary{
    background:var(--gold); color:var(--bg); border:none;
    padding:15px 30px; font-size:14px; font-weight:600;
    letter-spacing:0.04em; border-radius:2px;
    transition:transform 0.15s ease, background 0.2s ease;
  }
  .btn-primary:hover{ background:#DCAE4C; transform:translateY(-2px); }
  .btn-ghost{
    color:var(--cream); font-size:14px; letter-spacing:0.03em;
    border-bottom:1px solid var(--muted); padding-bottom:2px;
    transition:border-color 0.2s ease, color 0.2s ease;
  }
  .btn-ghost:hover{ color:var(--gold); border-color:var(--gold); }

  /* hero cup visual */
  .cup-visual{ position:relative; display:flex; justify-content:center; }
  .cup-frame{
    width:280px; height:280px; border-radius:50%;
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .cup-frame::before{
    content:''; position:absolute; inset:20px; border-radius:50%;
    border:1px dashed rgba(200,155,60,0.3);
  }
  .roast-dial{
    width:190px; height:190px; border-radius:50%;
    background:conic-gradient(var(--gold) 0deg, var(--rust) 200deg, var(--surface-2) 200deg 360deg);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  .roast-dial-inner{
    width:140px; height:140px; border-radius:50%; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4px;
  }
  .roast-dial-inner .num{ font-family:var(--font-display); font-size:34px; color:var(--cream); }
  .roast-dial-inner .label{ font-family:var(--font-mono); font-size:10px; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; }
  .orbit-tag{
    position:absolute; background:var(--surface); border:1px solid var(--line);
    padding:8px 14px; border-radius:20px; font-size:12px; color:var(--cream-dim);
    font-family:var(--font-mono);
  }
  .orbit-tag.t1{ top:6%; right:-4%; }
  .orbit-tag.t2{ bottom:10%; left:-8%; }

  /* SECTION HEADERS */
  .section{ padding:110px 0; border-top:1px solid var(--line); }
  .section-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:56px; gap:24px; flex-wrap:wrap; }
  .section-head h2{
    font-family:var(--font-display); font-weight:600; font-size:clamp(30px,4vw,44px);
    letter-spacing:-0.01em;
  }
  .section-head p{ color:var(--cream-dim); max-width:360px; font-size:15px; }
  .eyebrow-sm{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.15em;
    color:var(--gold); text-transform:uppercase; margin-bottom:14px; display:block;
  }

  /* MENU */
  .menu-tabs{ display:flex; gap:10px; margin-bottom:44px; flex-wrap:wrap; }
  .menu-tab{
    background:transparent; border:1px solid var(--line); color:var(--cream-dim);
    padding:9px 20px; border-radius:20px; font-size:13px; letter-spacing:0.02em;
    transition:all 0.2s ease;
  }
  .menu-tab.active, .menu-tab:hover{ border-color:var(--gold); color:var(--gold); }
  .menu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 48px; }
  .menu-item{
    display:flex; justify-content:space-between; gap:16px;
    padding:20px 0; border-bottom:1px solid var(--line);
  }
  .menu-item .mi-left h4{ font-family:var(--font-display); font-size:19px; font-weight:500; margin-bottom:4px; }
  .menu-item .mi-left p{ font-size:13px; color:var(--muted); max-width:280px; }
  .menu-item .mi-price{ font-family:var(--font-mono); color:var(--gold); font-size:15px; white-space:nowrap; }

  /* ROAST PROCESS */
  .process-track{ display:grid; grid-template-columns:repeat(4,1fr); gap:24px; position:relative; }
  .process-track::before{
    content:''; position:absolute; top:22px; left:0; right:0; height:1px;
    background:linear-gradient(90deg, var(--gold), var(--rust));
    z-index:0;
  }
  .process-step{ position:relative; z-index:1; }
  .process-step .pnum{
    width:44px; height:44px; border-radius:50%; background:var(--bg);
    border:1px solid var(--gold); color:var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:13px; margin-bottom:20px;
  }
  .process-step h4{ font-family:var(--font-display); font-size:18px; margin-bottom:8px; font-weight:500; }
  .process-step p{ font-size:13.5px; color:var(--cream-dim); }

  /* ABOUT / STORY */
  .about-grid{ display:grid; grid-template-columns:0.9fr 1.1fr; gap:64px; align-items:center; }
  .about-visual{
    aspect-ratio:4/5; border-radius:4px; position:relative; overflow:hidden;
    background:
      radial-gradient(circle at 30% 20%, rgba(200,155,60,0.25), transparent 55%),
      radial-gradient(circle at 75% 80%, rgba(165,80,42,0.3), transparent 55%),
      linear-gradient(160deg, var(--surface), #17110D);
    border:1px solid var(--line);
  }
  .about-visual .ring{
    position:absolute; border-radius:50%; border:1px solid rgba(239,230,216,0.15);
  }
  .about-visual .r1{ width:70%; aspect-ratio:1; top:15%; left:15%; }
  .about-visual .r2{ width:45%; aspect-ratio:1; bottom:12%; right:10%; border-color:rgba(200,155,60,0.35); }
  .about-copy h2{ font-family:var(--font-display); font-size:clamp(28px,3.4vw,38px); font-weight:600; margin-bottom:20px; letter-spacing:-0.01em; }
  .about-copy p{ color:var(--cream-dim); font-size:15.5px; margin-bottom:16px; max-width:480px; }
  .stat-row{ display:flex; gap:40px; margin-top:32px; }
  .stat-row .stat b{ display:block; font-family:var(--font-display); font-size:30px; color:var(--gold); }
  .stat-row .stat span{ font-size:12px; color:var(--muted); letter-spacing:0.04em; }

  /* TESTIMONIAL / QUOTE */
  .quote-block{ text-align:center; max-width:720px; margin:0 auto; }
  .quote-block p{
    font-family:var(--font-display); font-style:italic; font-size:clamp(22px,3vw,30px);
    line-height:1.5; color:var(--cream); margin-bottom:24px;
  }
  .quote-block cite{ font-family:var(--font-mono); font-size:12px; color:var(--gold); letter-spacing:0.05em; font-style:normal; }

  /* VISIT */
  .visit-grid{ display:grid; grid-template-columns:1fr 1fr; gap:64px; }
  .hours-list{ display:flex; flex-direction:column; gap:0; }
  .hours-row{ display:flex; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--line); font-size:14.5px; }
  .hours-row span:first-child{ color:var(--cream-dim); }
  .hours-row span:last-child{ font-family:var(--font-mono); color:var(--gold); }
  .contact-form{ display:flex; flex-direction:column; gap:14px; }
  .contact-form input, .contact-form textarea{
    background:var(--surface); border:1px solid var(--line); color:var(--cream);
    padding:14px 16px; border-radius:2px; font-family:var(--font-body); font-size:14px;
    outline:none; transition:border-color 0.2s ease;
  }
  .contact-form input:focus, .contact-form textarea:focus{ border-color:var(--gold); }
  .contact-form textarea{ resize:vertical; min-height:100px; }
  .form-msg{ font-size:13px; color:var(--gold); min-height:18px; }

  /* FOOTER */
  footer{ border-top:1px solid var(--line); padding:50px 0 30px; }
  .footer-grid{ display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:30px; margin-bottom:40px; }
  .footer-links{ display:flex; gap:48px; flex-wrap:wrap; }
  .footer-col h5{ font-family:var(--font-mono); font-size:11px; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:14px; }
  .footer-col a{ display:block; font-size:14px; color:var(--cream-dim); margin-bottom:10px; transition:color 0.2s ease; }
  .footer-col a:hover{ color:var(--gold); }
  .footer-bottom{ display:flex; justify-content:space-between; padding-top:24px; border-top:1px solid var(--line); font-size:12.5px; color:var(--muted); flex-wrap:wrap; gap:10px; }

  @media (max-width: 860px){
    .navlinks, .navcta{ display:none; }
    .navtoggle{ display:block; }
    .hero-grid, .about-grid, .visit-grid{ grid-template-columns:1fr; }
    .cup-visual{ margin-top:40px; }
    .process-track{ grid-template-columns:1fr 1fr; row-gap:36px; }
    .process-track::before{ display:none; }
    .menu-grid{ grid-template-columns:1fr; }
    .section{ padding:70px 0; }
    .wrap{ padding:0 20px; }
    nav{ padding:16px 20px; }
  }

  @media (max-width: 600px){
    html{ font-size:15px; }
    .hero{ padding:110px 0 60px; min-height:auto; }
    .hero-title{ font-size:clamp(32px, 9vw, 44px); }
    .hero p.lede{ font-size:15.5px; max-width:100%; }
    .hero-actions{ flex-wrap:wrap; gap:14px; }
    .btn-primary, .btn-ghost{ width:100%; text-align:center; }
    .btn-ghost{ border-bottom:none; padding:12px 0; }
    .cup-frame{ width:220px; height:220px; }
    .roast-dial{ width:150px; height:150px; }
    .roast-dial-inner{ width:110px; height:110px; }
    .roast-dial-inner .num{ font-size:26px; }
    .orbit-tag{ font-size:11px; padding:6px 10px; }
    .orbit-tag.t1{ top:0; right:0; }
    .orbit-tag.t2{ bottom:2%; left:-2%; }

    .section-head{ flex-direction:column; align-items:flex-start; gap:14px; }
    .section-head p{ max-width:100%; }
    .section{ padding:56px 0; }

    .menu-tabs{ overflow-x:auto; flex-wrap:nowrap; -webkit-overflow-scrolling:touch; padding-bottom:4px; }
    .menu-tab{ white-space:nowrap; }
    .menu-item{ flex-direction:column; gap:6px; padding:18px 0; }
    .menu-item .mi-price{ font-size:14px; }

    .process-track{ grid-template-columns:1fr; row-gap:28px; }

    .about-visual{ aspect-ratio:16/10; }
    .stat-row{ gap:26px; flex-wrap:wrap; }
    .stat-row .stat b{ font-size:24px; }

    .quote-block p{ font-size:20px; }

    .contact-form input, .contact-form textarea{ font-size:16px; } /* avoids iOS zoom on focus */
    .contact-form .btn-primary{ width:100%; }

    .footer-grid{ flex-direction:column; align-items:flex-start; gap:28px; }
    .footer-links{ gap:32px; width:100%; justify-content:space-between; }
    .footer-bottom{ flex-direction:column; gap:6px; }

    .wrap{ padding:0 18px; }
    nav{ padding:14px 18px; }
    .logo{ font-size:19px; }
  }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState } = React;

const MENU = {
  drip: {
    label: "Filter",
    items: [
      { name: "House Filter", desc: "Rotating single origin, brewed by the cup", price: "$4.50" },
      { name: "Pour Over — Bensa Daye", desc: "Jasmine, peach, black tea finish, our own washing station", price: "$6.50" },
      { name: "Cold Brew", desc: "18-hour steep, low acid, over ice", price: "$5.00" },
      { name: "Batch Decaf", desc: "Swiss water process, full flavor", price: "$4.00" },
    ]
  },
  espresso: {
    label: "Espresso",
    items: [
      { name: "Espresso", desc: "Double shot, our house blend", price: "$3.50" },
      { name: "Cortado", desc: "Equal parts espresso and steamed milk", price: "$4.50" },
      { name: "Flat White", desc: "Ristretto pull, microfoam", price: "$5.00" },
      { name: "Oat Cappuccino", desc: "Barista oat milk, double dusted", price: "$5.50" },
    ]
  },
  seasonal: {
    label: "Seasonal",
    items: [
      { name: "Spiced Honey Latte", desc: "Local wildflower honey, cardamom", price: "$6.00" },
      { name: "Maple Oat Cortado", desc: "Vermont maple, toasted oat", price: "$5.50" },
      { name: "Affogato", desc: "Vanilla bean gelato, hot espresso pour", price: "$6.50" },
      { name: "Cascara Fizz", desc: "Coffee cherry tea, soda, citrus", price: "$5.50" },
    ]
  }
};

const ROAST_STEPS = [
  { n: "01", title: "Sourced", body: "Green beans bought direct from growers we've visited, at prices well above commodity." },
  { n: "02", title: "Sampled", body: "Every lot cupped blind before it earns a place on the roast schedule." },
  { n: "03", title: "Roasted", body: "Small 12kg batches, roasted to the curve that fits that lot, not a house style." },
  { n: "04", title: "Rested", body: "Beans rest 5–10 days post-roast so CO2 settles before they reach your cup." },
];

function Nav(){
  const [open, setOpen] = useState(false);
  const links = ["Menu","Process","Story","Visit"];
  return (
    <header className="site">
      <nav>
        <div className="logo"><span className="mark">H&B</span>Hearth &amp; Bean</div>
        <div className="navlinks">
          {links.map(l => <a key={l} href={"#"+l.toLowerCase()}>{l}</a>)}
        </div>
        <a href="#visit" className="navcta">Order ahead</a>
        <button className="navtoggle" onClick={()=>setOpen(!open)} aria-label="Toggle menu">☰</button>
      </nav>
      {open && (
        <div style={{padding:"0 20px 20px", display:"flex", flexDirection:"column", gap:14}}>
          {links.map(l => <a key={l} href={"#"+l.toLowerCase()} onClick={()=>setOpen(false)}>{l}</a>)}
          <a href="#visit" className="navcta" style={{textAlign:"center"}} onClick={()=>setOpen(false)}>Order ahead</a>
        </div>
      )}
    </header>
  );
}

function Hero(){
  return (
    <section className="hero" id="top">
      <div className="wrap hero-grid">
        <div>
          <div className="eyebrow">Roasting since 2016 · Bensa Daye, Sidama, Ethiopia</div>
          <h1 className="hero-title">Coffee, roasted<br/>to tell the <em>truth</em><br/>about the bean.</h1>
          <p className="lede">We roast in small batches at the edge of the forest that grows our coffee, publish every lot's harvest date, and pay our neighboring farmers well above fair-trade minimums. No house blend hides a bad lot here.</p>
          <div className="hero-actions">
            <a href="#menu" className="btn-primary">See the menu</a>
            <a href="#story" className="btn-ghost">Our story</a>
          </div>
        </div>
        <div className="cup-visual">
          <div className="cup-frame">
            <div className="roast-dial">
              <div className="roast-dial-inner">
                <span className="num">14°C</span>
                <span className="label">First crack</span>
              </div>
            </div>
            <div className="orbit-tag t1">Lot #0472</div>
            <div className="orbit-tag t2">Medium roast</div>
          </div>
        </div>
      </div>
    </section>
  );
}

function Menu(){
  const [tab, setTab] = useState("drip");
  const active = MENU[tab];
  return (
    <section className="section" id="menu">
      <div className="wrap">
        <div className="section-head">
          <div>
            <span className="eyebrow-sm">On the counter</span>
            <h2>This week's menu</h2>
          </div>
          <p>Prices for a 12oz cup. Ask your barista which origin is pouring today.</p>
        </div>
        <div className="menu-tabs">
          {Object.keys(MENU).map(key => (
            <button key={key} className={"menu-tab" + (tab===key ? " active" : "")} onClick={()=>setTab(key)}>
              {MENU[key].label}
            </button>
          ))}
        </div>
        <div className="menu-grid">
          {active.items.map(item => (
            <div className="menu-item" key={item.name}>
              <div className="mi-left">
                <h4>{item.name}</h4>
                <p>{item.desc}</p>
              </div>
              <div className="mi-price">{item.price}</div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Process(){
  return (
    <section className="section" id="process">
      <div className="wrap">
        <div className="section-head">
          <div>
            <span className="eyebrow-sm">Bean to cup</span>
            <h2>How a lot earns its label</h2>
          </div>
          <p>Four checkpoints, in order, before any coffee reaches the bar.</p>
        </div>
        <div className="process-track">
          {ROAST_STEPS.map(step => (
            <div className="process-step" key={step.n}>
              <div className="pnum">{step.n}</div>
              <h4>{step.title}</h4>
              <p>{step.body}</p>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Story(){
  return (
    <section className="section" id="story">
      <div className="wrap about-grid">
        <div className="about-visual">
          <div className="ring r1"></div>
          <div className="ring r2"></div>
        </div>
        <div className="about-copy">
          <span className="eyebrow-sm">Since 2016</span>
          <h2>Grown, washed and roasted in Bensa Daye.</h2>
          <p>Hearth &amp; Bean began on a 1kg sample roaster in Bensa Daye, Sidama, on the same red highland soil that grows our cherry, when our founder Mara started roasting lots her own neighbors were harvesting by hand.</p>
          <p>Nine years on we still roast every lot ourselves a short walk from the washing station, still write the harvest date on the bag, and still believe the best cup is the one you can trace back to a farm.</p>
          <div className="stat-row">
            <div className="stat"><b>38</b><span>ORIGIN FARMS</span></div>
            <div className="stat"><b>9</b><span>YEARS ROASTING</span></div>
            <div className="stat"><b>1,900m</b><span>GROWING ALTITUDE</span></div>
          </div>
        </div>
      </div>
    </section>
  );
}

function Quote(){
  return (
    <section className="section" style={{paddingTop:0, paddingBottom:0, borderTop:"none"}}>
      <div className="wrap quote-block">
        <p>"The first roastery that let me taste the difference between a Bensa lot and a Guji lot without having to ask."</p>
        <cite>— Ethiopia Coffee Review, Roaster of the Year</cite>
      </div>
    </section>
  );
}

function Visit(){
  const [status, setStatus] = useState("");
  const handleSubmit = (e) => {
    e.preventDefault();
    const form = e.target;
    const name = form.name.value.trim();
    const email = form.email.value.trim();
    if(!name || !email){
      setStatus("Fill in your name and email first.");
      return;
    }
    setStatus("Thanks — we'll get back to you within a day.");
    form.reset();
  };
  return (
    <section className="section" id="visit">
      <div className="wrap visit-grid">
        <div>
          <span className="eyebrow-sm">Come by</span>
          <h2 style={{fontFamily:"var(--font-display)", fontSize:"clamp(28px,3.4vw,38px)", fontWeight:600, marginBottom:24}}>Hours &amp; location</h2>
          <div className="hours-list">
            <div className="hours-row"><span>Monday – Friday</span><span>7:00 – 18:00</span></div>
            <div className="hours-row"><span>Saturday</span><span>8:00 – 18:00</span></div>
            <div className="hours-row"><span>Sunday</span><span>8:00 – 15:00</span></div>
          </div>
          <p style={{marginTop:24, color:"var(--cream-dim)", fontSize:14.5}}>Bensa Daye Kebele, Sidama Region, Ethiopia</p>
        </div>
        <div>
          <span className="eyebrow-sm">Get in touch</span>
          <h2 style={{fontFamily:"var(--font-display)", fontSize:"clamp(28px,3.4vw,38px)", fontWeight:600, marginBottom:24}}>Send us a note</h2>
          <form className="contact-form" onSubmit={handleSubmit}>
            <input type="text" name="name" placeholder="Your name" />
            <input type="email" name="email" placeholder="name@email.com" />
            <textarea name="message" placeholder="Wholesale inquiry, event booking, or just say hi"></textarea>
            <button type="submit" className="btn-primary" style={{alignSelf:"flex-start"}}>Send message</button>
            <div className="form-msg">{status}</div>
          </form>
        </div>
      </div>
    </section>
  );
}

function Footer(){
  return (
    <footer>
      <div className="wrap">
        <div className="footer-grid">
          <div className="logo"><span className="mark">H&B</span>Hearth &amp; Bean</div>
          <div className="footer-links">
            <div className="footer-col">
              <h5>Shop</h5>
              <a href="#menu">Menu</a>
              <a href="#visit">Order ahead</a>
              <a href="#">Gift cards</a>
            </div>
            <div className="footer-col">
              <h5>About</h5>
              <a href="#process">Our process</a>
              <a href="#story">Our story</a>
              <a href="#">Wholesale</a>
            </div>
            <div className="footer-col">
              <h5>Connect</h5>
              <a href="#">Instagram</a>
              <a href="#">Newsletter</a>
              <a href="#visit">Contact</a>
            </div>
          </div>
        </div>
        <div className="footer-bottom">
          <span>© 2026 Hearth &amp; Bean Coffee Roasters.</span>
          <span>Roasted and grown in Bensa Daye, Sidama, Ethiopia.</span>
        </div>
      </div>
    </footer>
  );
}

function App(){
  return (
    <React.Fragment>
      <Nav />
      <Hero />
      <Menu />
      <Process />
      <Story />
      <Quote />
      <Visit />
      <Footer />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
